<div class="min-h-screen bg-background">
  <div class="mx-auto max-w-7xl space-y-6 px-4 py-6">
    <!-- Page Header -->
    <section class="space-y-3 pb-2">
      <app-case-header
        title="الحالات العاجلة"
        subtitle="إدارة وعرض جميع الحالات العاجلة"
        [badge]="!loading ? totalItems + ' حالة' : ''"
        badgeClass="bg-error-container text-on-error-container"
        [loading]="loading"
        primaryActionLabel="إنشاء حالة عاجلة"
        primaryButtonClass="bg-error hover:opacity-90 text-on-error shadow-sm"
        [bordered]="false"
        (primaryAction)="navigateToCreate()"
      >
      </app-case-header>
    </section>

    <!-- Filters Card -->
    <section
      class="overflow-hidden rounded-xl border border-outline-variant bg-surface-container-lowest shadow-sm"
    >
      <app-case-filters (filterChange)="onFilterChange($event)" (reset)="onFilterReset()">
        <!-- Urgent-only extra filter -->
        <div extendedFilters>
          <label class="mb-2 block text-sm font-medium text-on-surface-variant">
            نطاق البحث (متر)
          </label>

          <div class="relative">
            <input
              type="number"
              min="100"
              [(ngModel)]="radiusInMeters"
              [ngModelOptions]="{ standalone: true }"
              placeholder="بدون حد"
              class="h-12 w-full rounded-xl border border-outline-variant bg-surface-container-lowest px-4 pr-10 text-on-surface placeholder:text-on-surface-variant outline-none transition-all duration-200 focus:border-secondary focus:ring-4 focus:ring-secondary/20"
            />

            <svg
              class="pointer-events-none absolute right-3 top-1/2 h-5 w-5 -translate-y-1/2 text-on-surface-variant"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M17.657 16.657L13.414 12.414a4 4 0 10-.707.707l4.243 4.243a1 1 0 001.414-1.414z"
              />
            </svg>
          </div>

          <p class="mt-2 text-xs text-on-surface-variant">
            اترك الحقل فارغًا للبحث بدون تحديد نطاق.
          </p>
        </div>
      </app-case-filters>
    </section>

    <!-- Main Content -->
    <div class="space-y-4">
      <!-- Loading Skeleton -->
      @if (loading) {
        <app-case-skeleton-grid></app-case-skeleton-grid>
      }

      <!-- Empty State -->
      @if (!loading && cases.length === 0) {
        <app-empty-state
          title="لا توجد حالات عاجلة"
          message="لم يتم العثور على أي حالات عاجلة تطابق معايير البحث الحالية."
        >
        </app-empty-state>
      }

      @if (!loading && cases.length > 0) {
        <!-- Cases Grid -->
        <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
          @for (case of cases; track trackByCaseId($index, case)) {
            <app-urgent-case-card
              [caseItem]="case"
              [showUrgentTag]="true"
              (onContact)="onContactReporter($event)"
              class="block transition-transform duration-200 will-change-transform hover:-translate-y-1"
            >
            </app-urgent-case-card>
          }
        </div>

        <!-- Pagination (shows its own "showing X-Y of Z" summary since totalItems/pageSize are passed) -->
        <app-pagination
          [currentPage]="currentPage"
          [totalPages]="totalPages"
          [totalItems]="totalItems"
          [pageSize]="pageSize"
          (pageChange)="onPageChange($event)"
        >
        </app-pagination>
      }
    </div>
  </div>
</div>
