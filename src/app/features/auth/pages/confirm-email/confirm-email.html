<div class="min-h-screen bg-surface flex flex-col justify-center items-center px-margin-mobile py-12">
  <div class="text-center mb-8">
    <a routerLink="/home" class="inline-flex items-center justify-center bg-primary text-on-primary w-12 h-12 rounded-xl mb-4 hover:scale-105 transition-transform shadow-md">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
    </a>
    <h1 class="text-3xl font-headline-lg font-bold text-primary mb-2">تأكيد البريد الإلكتروني</h1>
    <p class="text-on-surface-variant text-body-md max-w-87.5">لقد أرسلنا رمز تحقق مكون من 6 أرقام إلى {{ email() }}</p>
  </div>

  <div class="bg-surface-container-lowest border border-outline-variant rounded-2xl shadow-sm w-full max-w-112.5 p-6 md:p-8">
    @if (apiErrorMessage()) {
      <div class="bg-error-container text-on-error-container p-4 rounded-xl mb-6 flex gap-3 border border-error/20">
        <span class="font-body-sm font-medium">{{ apiErrorMessage() }}</span>
      </div>
    }

    <form [formGroup]="confirmForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
      <div class="flex flex-col gap-1">
        <label class="text-label-md font-medium text-on-surface text-center mb-2">أدخل الرمز هنا</label>
        <input type="text" formControlName="otpCode" placeholder="••••••" maxlength="6" dir="ltr"
               [class.border-error]="confirmForm.get('otpCode')?.touched && confirmForm.get('otpCode')?.invalid"
               class="w-full border border-outline focus:border-secondary focus:ring-1 focus:ring-secondary rounded-xl px-4 py-4 text-center tracking-widest text-2xl font-bold text-on-surface bg-surface-container-lowest outline-none transition-all">
      </div>

      <button type="submit" [disabled]="isLoading()" class="w-full bg-secondary text-on-secondary hover:bg-secondary-container disabled:bg-surface-variant disabled:text-outline py-3 rounded-xl font-label-lg font-semibold transition-all mt-2">
        @if (isLoading()) { جاري التأكيد... } @else { تأكيد الحساب }
      </button>
    </form>

    <div class="text-center mt-6">
      <p class="text-on-surface-variant text-body-sm">
        لم يصلك الرمز؟ <button (click)="resendOtp()" class="text-secondary font-semibold hover:underline bg-transparent border-none cursor-pointer">إعادة الإرسال</button>
      </p>
    </div>
  </div>
</div>
