<div
  class="bg-white border border-outline-variant rounded-xl p-4 shadow-sm mb-8"
  [formGroup]="form"
>
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
    <div class="relative">
      <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline"
        >search</span
      >
      <input
        type="text"
        formControlName="search"
        placeholder="البحث بالاسم أو المواصفات..."
        class="w-full pr-10 pl-4 py-3 rounded-lg border border-outline-variant bg-surface focus:ring-2 focus:ring-secondary focus:border-transparent outline-none transition-all"
      />
    </div>

    <select
      formControlName="gender"
      class="border border-outline-variant rounded-lg px-4 py-3 bg-surface text-body-md outline-none focus:ring-2 focus:ring-secondary cursor-pointer"
    >
      <option [ngValue]="null">الجنس</option>
      <option [ngValue]="1">ذكر</option>
      <option [ngValue]="2">أنثى</option>
    </select>

    <select
      formControlName="ageCategory"
      class="border border-outline-variant rounded-lg px-4 py-3 bg-surface text-body-md outline-none focus:ring-2 focus:ring-secondary cursor-pointer"
    >
      <option [value]="0">الفئة العمرية</option>
      <option [value]="1">طفل (0-12)</option>
      <option [value]="2">مراهق (13-19)</option>
      <option [value]="3">بالغ (20-60)</option>
      <option [value]="4">مسن (+60)</option>
    </select>
  </div>
</div>
