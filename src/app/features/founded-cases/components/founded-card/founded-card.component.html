<div
  class="group bg-white rounded-xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 border border-[#c5c6cd]/20 flex flex-col"
>
  <!-- Image -->
  <div class="relative h-64 overflow-hidden bg-[#e5eeff]">
    <img
      [src]="imageUrl"
      [alt]="person.name"
      class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
      (error)="$any($event.target).src = 'assets/images/placeholder-person.png'"
    />
    <!-- Status Badge -->
    <div
      class="absolute top-4 right-4 bg-[#71f8e4] text-[#001815] px-3 py-1 rounded-full text-xs font-semibold shadow-sm"
    >
      {{ statusLabel }}
    </div>
  </div>

  <!-- Card Body -->
  <div class="p-6 flex flex-col flex-grow">
    <h3 class="text-lg font-bold text-[#091426] mb-3">{{ person.name }}</h3>

    <div class="space-y-2 mb-6 flex-grow">
      <!-- Age -->
      <div class="flex justify-between items-center text-sm text-[#45474c]">
        <span>الفئة العمرية:</span>
        <span class="font-bold">{{ person.age }}</span>
      </div>
      <!-- Found Date -->
      <div class="flex justify-between items-center text-sm text-[#45474c]">
        <span>تاريخ العثور:</span>
        <span class="font-medium">{{ formattedDate }}</span>
      </div>
    </div>

    <!-- Action Button -->
    <button
      class="w-full bg-[#0058be] text-white py-3 rounded-lg font-bold hover:bg-[#2170e4] transition-colors duration-200 flex items-center justify-center gap-2"
    >
      <span>عرض التفاصيل</span>
      <span class="material-symbols-outlined text-base">arrow_back</span>
    </button>
  </div>
</div>
