@if (open()) {
  <div
    class="fixed inset-0 z-90 flex items-center justify-center p-md bg-black/50 backdrop-blur-sm animate-fade-in"
    (click)="onBackdropClick()"
    role="presentation"
  >
    <div
      class="bg-surface w-[80vh] rounded-2xl shadow-xl p-lg space-y-md border border-outline-variant animate-fade-in"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirm-dialog-title"
      aria-describedby="confirm-dialog-message"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-center gap-sm">
        <span
          class="material-symbols-outlined text-[26px]"
          [class.text-error]="danger()"
          [class.text-secondary]="!danger()"
          style="font-variation-settings: 'FILL' 1"
          aria-hidden="true"
        >
          {{ danger() ? 'warning' : 'help' }}
        </span>
        <h3 id="confirm-dialog-title" class="text-headline-sm font-bold text-on-surface">
          {{ title() }}
        </h3>
      </div>

      <p id="confirm-dialog-message" class="text-body-sm text-on-surface-variant leading-6">
        {{ message() }}
      </p>

      <div class="flex items-center justify-end gap-sm pt-sm">
        <button
          type="button"
          [disabled]="loading()"
          (click)="cancelled.emit()"
          class="px-md py-xs text-secondary border border-secondary rounded-lg text-label-sm font-bold hover:bg-secondary-fixed focus-visible:ring-2 focus-visible:ring-secondary transition-colors disabled:opacity-50 cursor-pointer"
        >
          {{ cancelLabel() }}
        </button>
        <button
          type="button"
          [disabled]="loading()"
          (click)="confirmed.emit()"
          [attr.aria-busy]="loading()"
          class="px-md py-xs rounded-lg text-label-sm font-bold transition-all flex items-center gap-xs disabled:opacity-50 cursor-pointer"
          [class.bg-error]="danger()"
          [class.text-on-error]="danger()"
          [class.bg-secondary]="!danger()"
          [class.text-on-primary]="!danger()"
        >
          @if (loading()) {
            <span class="material-symbols-outlined text-[14px] animate-spin" aria-hidden="true"
              >progress_activity</span
            >
          }
          {{ confirmLabel() }}
        </button>
      </div>
    </div>
  </div>
}
