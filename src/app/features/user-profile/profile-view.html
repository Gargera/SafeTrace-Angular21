<div class="bg-background text-on-background min-h-screen flex flex-col">
  <main class="flex-1 max-w-max-width mx-auto w-full px-margin-mobile md:px-margin-desktop py-lg">
    <!-- Loading State -->
    @if (isLoading()) {
      <div class="flex justify-center items-center py-xl">
        <span class="material-symbols-outlined text-secondary text-[48px] animate-spin"> </span>
      </div>
    }

    <!-- Error State -->
    @else if (loadError()) {
      <div class="p-md bg-error-container text-on-error-container rounded-xl text-center">
        <p class="text-body-sm font-bold">{{ loadError() }}</p>
        <button
          (click)="ngOnInit()"
          class="mt-md px-lg py-sm bg-error text-white rounded-lg text-label-sm hover:opacity-90"
        >
          إعادة المحاولة
        </button>
      </div>
    }

    <!-- Main Content -->
    @else {
      <div class="grid grid-cols-1 md:grid-cols-14 gap-gutter">
        <!-- Sidebar -->

        <div class="md:block md:col-span-4">
          <app-profile-sidebar
            [userInfo]="userInfo()"
            (imageClicked)="selectedZoomImage.set(avatarUrl)"
          />

          @if (selectedZoomImage()) {
            <div
              class="fixed inset-0 z-[999999] bg-black/70 flex items-center justify-center"
              (click)="selectedZoomImage.set(null)"
            >
              <img
                [src]="selectedZoomImage()"
                class="max-w-[90vw] max-h-[90vh]"
                (click)="$event.stopPropagation()"
              />
            </div>
          }
        </div>

        <!-- Main Content Area -->
        <div class="md:col-span-10">
          <!-- Tabs Navigation -->
          <div class="bg-surface-container-lowest rounded-xl shadow-sm mb-gutter overflow-hidden">
            <nav class="border-b border-outline-variant">
              <div
                class="flex gap-xs overflow-x-auto snap-x snap-mandatory -mx-md px-md sm:-mx-lg sm:px-lg lg:mx-0 lg:px-0 lg:flex-wrap lg:overflow-visible [-ms-overflow-style:none] [scrollbar-width:none] [&::-webkit-scrollbar]:hidden pb-xs"
              >
                @for (tab of tabs; track tab.id) {
                  <button
                    type="button"
                    (click)="switchTab(tab.id)"
                    class="shrink-0 snap-start whitespace-nowrap px-lg py-sm rounded-t-lg text-body-sm font-medium transition-colors border-b-2"
                    [class.border-primary]="activeTab() === tab.id"
                    [class.text-primary]="activeTab() === tab.id"
                    [class.border-transparent]="activeTab() !== tab.id"
                    [class.text-on-surface-variant]="activeTab() !== tab.id"
                  >
                    {{ tab.label }}
                  </button>
                }
              </div>
            </nav>

            <!-- Tab Content -->
            @switch (activeTab()) {
              @case ('edit') {
                <app-edit-profile
                  [userInfo]="userInfo()"
                  (profileUpdated)="onProfileUpdated($event)"
                />
              }

              @case ('cases') {
                <div class="p-lg">
                  <app-my-cases-tab />
                </div>
              }

              @case ('chat') {
                <app-my-chats />
              }
              @case ('notifications') {
                <app-notifications-tab />
              }
              @case ('donations') {
                <app-donation-history />
              }
            }
          </div>
        </div>
      </div>
    }
  </main>
</div>
