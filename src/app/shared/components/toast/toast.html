@if (snackbar.message(); as msg) {
  <div class="fixed bottom-6 right-6 z-50 pointer-events-none flex justify-end" aria-live="polite">
    <div
      [attr.role]="msg.type === 'error' ? 'alert' : 'status'"
      class="pointer-events-auto flex items-center gap-3 w-90 max-w-[calc(100vw-2rem)] px-4 py-3 rounded-2xl border shadow-2xl backdrop-blur-md animate-fade-in transition-all duration-300"
      [class.bg-tertiary-container]="msg.type === 'success'"
      [class.text-on-tertiary-container]="msg.type === 'success'"
      [class.border-green-300]="msg.type === 'success'"
      [class.bg-error-container]="msg.type === 'error'"
      [class.text-on-error-container]="msg.type === 'error'"
      [class.border-red-300]="msg.type === 'error'"
      [class.bg-surface-container-high]="msg.type === 'info'"
      [class.text-on-surface]="msg.type === 'info'"
      [class.border-outline-variant]="msg.type === 'info'"
      [class.bg-yellow-100]="msg.type === 'warning'"
      [class.text-yellow-800]="msg.type === 'warning'"
      [class.border-yellow-300]="msg.type === 'warning'"
    >
      <span
        class="material-symbols-outlined text-2xl shrink-0"
        style="font-variation-settings: 'FILL' 1"
        aria-hidden="true"
      >
        {{ msg.type === 'success' ? 'check_circle' : msg.type === 'error' ? 'error' : msg.type === 'warning' ? 'warning' : 'info' }}
      </span>

      <span class="flex-1 text-sm font-medium leading-5 wrap-break-word">
        {{ msg.text }}
      </span>

      <button
        type="button"
        (click)="snackbar.dismiss()"
        aria-label="إغلاق"
        class="shrink-0 grid place-items-center w-9 h-9 rounded-full transition-all duration-200 hover:bg-black/10 active:scale-95 cursor-pointer"
      >
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true"> close </span>
      </button>
    </div>
  </div>
}
