@if (totalPages() > 1) {

<div class="mt-16 flex flex-col items-center justify-center gap-3">

  <!-- Summary -->
  @if (totalItems() && pageSize()) {
    <p class="text-sm text-on-surface-variant">
      عرض
      <span class="font-semibold text-on-surface">{{ startItem() }}</span>
      -
      <span class="font-semibold text-on-surface">{{ endItem() }}</span>
      من
      <span class="font-semibold text-on-surface">{{ totalItems() }}</span>
      نتيجة
    </p>
  }

  <div class="flex flex-wrap items-center justify-center gap-2">

    <!-- First Page -->
    <button
      type="button"
      [disabled]="currentPage() === 1"
      (click)="firstPage()"
      aria-label="الصفحة الأولى"
      class="hidden h-10 w-10 items-center justify-center rounded-full border border-outline-variant text-on-surface-variant transition-all hover:border-secondary hover:bg-surface-container hover:text-secondary disabled:cursor-not-allowed disabled:opacity-40 sm:flex"
    >
      <span class="material-symbols-outlined text-xl">
        last_page
      </span>
    </button>

    <!-- Previous -->
    <button
      type="button"
      [disabled]="currentPage() === 1"
      (click)="prevPage()"
      aria-label="الصفحة السابقة"
      class="flex h-10 w-10 items-center justify-center rounded-full border border-outline-variant text-on-surface-variant transition-all hover:border-secondary hover:bg-surface-container hover:text-secondary disabled:cursor-not-allowed disabled:opacity-40"
    >
      <span class="material-symbols-outlined text-xl">
        chevron_right
      </span>
    </button>

    <!-- Page Numbers -->
    <div class="flex items-center gap-1">

      @for (page of pageNumbers(); track page) {

        @if (page === '...') {

          <span
            class="flex h-10 w-10 select-none items-center justify-center text-on-surface-variant">
            …
          </span>

        } @else {

          <button
            type="button"
            (click)="goToPage(page)"
            [attr.aria-label]="'الصفحة ' + page"
            class="flex h-10 w-10 items-center justify-center rounded-full border text-sm font-medium transition-all duration-200"
            [ngClass]="{
              'border-outline-variant text-on-surface hover:border-secondary hover:bg-surface-container hover:text-secondary': page !== currentPage(),
              'border-secondary bg-secondary text-on-secondary font-bold shadow-sm scale-105': page === currentPage()
            }"
          >
            {{ page }}
          </button>

        }

      }

    </div>

    <!-- Next -->
    <button
      type="button"
      [disabled]="currentPage() === totalPages()"
      (click)="nextPage()"
      aria-label="الصفحة التالية"
      class="flex h-10 w-10 items-center justify-center rounded-full border border-outline-variant text-on-surface-variant transition-all hover:border-secondary hover:bg-surface-container hover:text-secondary disabled:cursor-not-allowed disabled:opacity-40"
    >
      <span class="material-symbols-outlined text-xl">
        chevron_left
      </span>
    </button>

    <!-- Last Page -->
    <button
      type="button"
      [disabled]="currentPage() === totalPages()"
      (click)="lastPage()"
      aria-label="الصفحة الأخيرة"
      class="hidden h-10 w-10 items-center justify-center rounded-full border border-outline-variant text-on-surface-variant transition-all hover:border-secondary hover:bg-surface-container hover:text-secondary disabled:cursor-not-allowed disabled:opacity-40 sm:flex"
    >
      <span class="material-symbols-outlined text-xl">
        first_page
      </span>
    </button>

  </div>

</div>

}
