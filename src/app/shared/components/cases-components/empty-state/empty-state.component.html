<div class="flex flex-col items-center justify-center py-12 text-center" [ngClass]="containerClass">
  <div
    class="flex h-16 w-16 items-center justify-center rounded-full bg-surface-container-lowest mb-4"
  >
    <svg
      class="h-8 w-8 text-on-surface-variant"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      aria-hidden="true"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"
      />
    </svg>
  </div>

  <h3 class="text-lg font-semibold text-on-surface">{{ title }}</h3>
  <p class="mt-1 text-sm text-on-surface-variant max-w-xl">{{ message }}</p>

  <div class="mt-4 flex gap-3">
    <ng-content select="[emptyActions]"></ng-content>
  </div>
</div>
