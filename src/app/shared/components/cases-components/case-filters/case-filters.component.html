<div
  class="rounded-xl border border-outline-variant bg-surface-container-lowest p-6 shadow-sm"
  dir="rtl"
>
  <form [formGroup]="filterForm" (ngSubmit)="onSubmit()" class="space-y-8">
    <!-- Header -->
    <div class="flex flex-col gap-2">
      <h2 class="text-xl font-bold text-on-surface">تصفية النتائج</h2>

      <p class="text-sm text-on-surface-variant">
        استخدم الفلاتر للوصول إلى النتائج المطلوبة بسرعة.
      </p>
    </div>

    <!-- Main Filters -->
    <div class="grid grid-cols-1 gap-6 md:grid-cols-2 xl:grid-cols-4">
      <!-- Search -->
      <div>
        <label class="mb-2 block text-sm font-medium text-on-surface-variant">بحث</label>

        <div class="relative">
          <input
            type="text"
            formControlName="fullName"
            placeholder="ابحث بالاسم..."
            class="h-12 w-full rounded-xl border border-outline-variant bg-surface-container-lowest pr-11 pl-4 text-sm text-on-surface placeholder:text-on-surface-variant outline-none transition-all duration-200 focus:border-secondary focus:ring-4 focus:ring-secondary/20"
          />

          <svg
            class="pointer-events-none absolute right-4 top-1/2 h-5 w-5 -translate-y-1/2 text-on-surface-variant"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"
            />
          </svg>
        </div>
      </div>
      <!-- Gender -->

      <div>
        <label class="mb-2 block text-sm font-medium text-on-surface-variant">النوع</label>

        <div class="relative">
          <select
            formControlName="gender"
            class="h-12 w-full appearance-none rounded-xl border border-outline-variant bg-surface-container-lowest px-4 pl-11 text-sm text-on-surface outline-none transition focus:border-secondary focus:ring-4 focus:ring-secondary/20"
          >
            <option [ngValue]="null">الكل</option>

            @for (gender of genders; track gender) {
              <option [ngValue]="gender">
                {{ getGenderLabel(gender) }}
              </option>
            }
          </select>

          <svg
            class="pointer-events-none absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-on-surface-variant"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </div>
      </div>

      <!-- Age Category -->
      <div>
        <label class="mb-2 block text-sm font-medium text-on-surface-variant">فئة العمر</label>

        <div class="relative">
          <select
            formControlName="ageCategory"
            class="h-12 w-full appearance-none rounded-xl border border-outline-variant bg-surface-container-lowest px-4 pl-11 text-sm text-on-surface outline-none transition focus:border-secondary focus:ring-4 focus:ring-secondary/20"
          >
            <option [ngValue]="null">الكل</option>

            @for (ageCategory of ageCategories; track ageCategory) {
              <option [ngValue]="ageCategory">
                {{ getAgeCategoryLabel(ageCategory) }}
              </option>
            }
          </select>

          <svg
            class="pointer-events-none absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-on-surface-variant"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </div>
      </div>

      <!-- Sort -->

      <div>
        <label class="mb-2 block text-sm font-medium text-on-surface-variant">الترتيب</label>

        <div class="relative">
          <select
            formControlName="dateSort"
            class="h-12 w-full appearance-none rounded-xl border border-outline-variant bg-surface-container-lowest px-4 pl-11 text-sm text-on-surface outline-none transition focus:border-secondary focus:ring-4 focus:ring-secondary/20"
          >
            <option [ngValue]="null">بدون ترتيب</option>
            <option [ngValue]="0">{{ getDateSortLabel(0) }}</option>
            <option [ngValue]="1">{{ getDateSortLabel(1) }}</option>
          </select>

          <svg
            class="pointer-events-none absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-on-surface-variant"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </div>
      </div>
    </div>

    <!-- Advanced Button -->

    <div>
      <button
        type="button"
        (click)="toggleAdvanced()"
        class="inline-flex items-center gap-3 rounded-xl border border-outline-variant bg-surface-container px-5 py-3 text-sm font-semibold transition hover:bg-surface-container-highest"
      >
        <span>
          {{ showAdvanced ? 'إخفاء الفلاتر المتقدمة' : 'فلاتر متقدمة' }}
        </span>

        @if (activeAdvancedCount > 0) {
          <span class="rounded-full bg-secondary px-2 py-1 text-xs font-semibold text-on-secondary">
            {{ activeAdvancedCount }}
          </span>
        }
      </button>
    </div>

    @if (showAdvanced) {
      <div
        class="grid grid-cols-1 gap-6 rounded-2xl border border-outline-variant bg-surface-container p-6 md:grid-cols-2 xl:grid-cols-4"
      >
        <div>
          <label class="mb-2 block text-sm font-medium text-on-surface-variant">المحافظة</label>

          <input
            formControlName="government"
            class="h-12 w-full rounded-xl border border-outline-variant bg-surface-container-lowest px-4 text-on-surface outline-none focus:border-secondary focus:ring-4 focus:ring-secondary/20"
          />
        </div>

        <div>
          <label class="mb-2 block text-sm font-medium text-on-surface-variant">المدينة</label>

          <input
            formControlName="city"
            class="h-12 w-full rounded-xl border border-outline-variant bg-surface-container-lowest px-4 text-on-surface outline-none focus:border-secondary focus:ring-4 focus:ring-secondary/20"
          />
        </div>

        <div>
          <label class="mb-2 block text-sm font-medium text-on-surface-variant">من تاريخ</label>

          <input
            type="date"
            formControlName="fromDate"
            class="h-12 w-full rounded-xl border border-outline-variant bg-surface-container-lowest px-4 text-on-surface outline-none focus:border-secondary focus:ring-4 focus:ring-secondary/20"
          />
        </div>

        <div>
          <label class="mb-2 block text-sm font-medium text-on-surface-variant">إلى تاريخ</label>

          <input
            type="date"
            formControlName="toDate"
            class="h-12 w-full rounded-xl border border-outline-variant bg-surface-container-lowest px-4 text-on-surface outline-none focus:border-secondary focus:ring-4 focus:ring-secondary/20"
          />
        </div>

        <div>
          <label class="mb-2 block text-sm font-medium text-on-surface-variant">
            الفئة العمرية
          </label>

          <div class="relative">
            <select
              formControlName="ageCategory"
              class="h-12 w-full appearance-none rounded-xl border border-outline-variant bg-surface-container-lowest px-4 pl-10 text-on-surface outline-none transition-all focus:border-secondary focus:ring-4 focus:ring-secondary/20"
            >
              <option [ngValue]="null">بدون ترتيب</option>

              @for (sort of ageSorts; track sort) {
                <option [ngValue]="sort">
                  {{ getAgeSortLabel(sort) }}
                </option>
              }
            </select>

            <svg
              class="pointer-events-none absolute left-3 top-1/2 h-5 w-5 -translate-y-1/2 text-on-surface-variant"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 9l-7 7-7-7"
              />
            </svg>
          </div>
        </div>
        <ng-content select="[extendedFilters]"></ng-content>
      </div>
    }

    <!-- Footer -->

    <div class="flex flex-wrap justify-end gap-4 border-t border-outline-variant pt-6">
      <button
        type="button"
        (click)="resetFilters()"
        class="rounded-xl border border-outline-variant bg-surface-container px-6 py-3 font-semibold text-on-surface transition hover:bg-surface-container-highest"
      >
        إعادة تعيين
      </button>

      <button
        type="submit"
        class="rounded-xl bg-primary px-8 py-3 font-semibold text-on-primary transition hover:opacity-95"
      >
        بحث
      </button>
    </div>
  </form>
</div>
