<app-card extraClass="rounded-xl border border-outline-variant bg-surface-container-lowest p-6 shadow-sm" dir="rtl">
  <form [formGroup]="filterForm" class="space-y-6">
    <!-- Main Filters Grid -->
    <div class="grid grid-cols-1 gap-5 md:grid-cols-2 xl:grid-cols-4">
      <div>
        <app-label>بحث</app-label>
        <app-text-input formControlName="fullName" placeholder="ابحث بالاسم..." [prefix]="true">
          <span prefix><app-icon name="search" size="1rem" extraClass="text-on-surface-variant"></app-icon></span>
        </app-text-input>
      </div>

      <div>
        <app-label>النوع</app-label>
        <app-select-input formControlName="gender" [icon]="true">
          <option value="">الكل</option>
          @for (gender of genders; track gender) {
            <option [value]="gender">{{ getGenderLabel(gender) }}</option>
          }
          <span icon><app-icon name="chevron" size="1rem" extraClass="text-on-surface-variant"></app-icon></span>
        </app-select-input>
      </div>

      <div>
        <app-label>فئة العمر</app-label>
        <app-select-input formControlName="ageCategory" [icon]="true">
          <option value="">الكل</option>
          @for (ageCategory of ageCategories; track ageCategory) {
            <option [value]="ageCategory">{{ getAgeCategoryLabel(ageCategory) }}</option>
          }
          <span icon><app-icon name="chevron" size="1rem" extraClass="text-on-surface-variant"></app-icon></span>
        </app-select-input>
      </div>

      <div>
        <app-label>ترتيب العمر</app-label>
        <app-select-input formControlName="ageSort" [icon]="true">
          <option value="">بدون ترتيب</option>
          @for (sort of ageSorts; track sort) {
            <option [value]="sort">{{ getAgeSortLabel(sort) }}</option>
          }
          <span icon><app-icon name="chevron" size="1rem" extraClass="text-on-surface-variant"></app-icon></span>
        </app-select-input>
      </div>
    </div>

    <!-- Advanced Filters Toggle -->
    <div class="flex items-center gap-3 pt-1 m-0">
      <div class="h-px flex-1 bg-outline-variant/20"></div>

      <button type="button" (click)="toggleAdvanced()" class="group inline-flex shrink-0 cursor-pointer items-center gap-1.5 text-sm font-medium text-on-surface-variant transition-all duration-200 hover:text-secondary focus:outline-none">
        <span class="relative">
          فلاتر إضافية
          <span class="absolute -bottom-0.5 left-0 h-0.5 w-0 bg-secondary transition-all duration-300 group-hover:w-full" [class.w-full]="showAdvanced"></span>
        </span>

        @if (activeAdvancedCount > 0) {
          <span class="bg-secondary/10 px-1.5 text-secondary rounded-full">
            {{ activeAdvancedCount }}
          </span>
        }

        <app-icon name="chevron" size="0.875rem" extraClass="shrink-0 transition-transform duration-300" [rotation]="showAdvanced ? 180 : 0"></app-icon>
      </button>

      <div class="h-px flex-1 bg-outline-variant/20"></div>
    </div>

    <!-- Advanced Filters Content -->
    <div class="grid transition-[grid-template-rows] duration-300 ease-in-out m-0" [style.grid-template-rows]="showAdvanced ? '1fr' : '0fr'">
      <div class="overflow-hidden">
        <div class="grid grid-cols-1 gap-5 pt-4 transition-all duration-300 ease-out md:grid-cols-2 xl:grid-cols-4" [class.opacity-100]="showAdvanced" [class.translate-y-0]="showAdvanced" [class.opacity-0]="!showAdvanced" [class.-translate-y-2]="!showAdvanced">
          <div>
            <app-label>المحافظة</app-label>
            <app-text-input formControlName="government" placeholder="المحافظة..."></app-text-input>
          </div>

          <div>
            <app-label>المدينة</app-label>
            <app-text-input formControlName="city" placeholder="المدينة..."></app-text-input>
          </div>

          <div>
            <app-label>من تاريخ</app-label>
            <app-date-input formControlName="fromDate"></app-date-input>
          </div>

          <div>
            <app-label>إلى تاريخ</app-label>
            <app-date-input formControlName="toDate"></app-date-input>
          </div>

          <div>
            <app-label>ترتيب التاريخ</app-label>
            <app-select-input formControlName="dateSort" [icon]="true">
              <option value="">بدون ترتيب</option>
              <option value="0">{{ getDateSortLabel(0) }}</option>
              <option value="1">{{ getDateSortLabel(1) }}</option>
              <span icon><app-icon name="chevron" size="1rem" extraClass="text-on-surface-variant"></app-icon></span>
            </app-select-input>
          </div>

          <ng-content select="[extendedFilters]"></ng-content>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="flex flex-wrap justify-end gap-3 pt-2">
      <app-button variant="text" type="button" (onClick)="resetFilters()" extraClass="group inline-flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium text-on-surface-variant transition-all duration-200 hover:bg-surface-container-high hover:text-primary">
        <app-icon name="reset" size="1rem" extraClass="transition-transform duration-200 group-hover:-rotate-90"></app-icon>
        <span>إعادة تعيين</span>
      </app-button>
    </div>
  </form>
</app-card>
