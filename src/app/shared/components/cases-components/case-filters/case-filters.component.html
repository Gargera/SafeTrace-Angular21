<div
  class="rounded-xl border border-outline-variant bg-surface-container-lowest p-6 shadow-sm"
  dir="rtl"
>
  <form [formGroup]="filterForm" class="space-y-6">
    <!-- Main Filters Grid -->
    <div class="grid grid-cols-1 gap-5 md:grid-cols-2 xl:grid-cols-4">
      <!-- Search -->
      <div>
        <label class="mb-1.5 block text-sm font-medium text-on-surface-variant">بحث</label>

        <div class="relative">
          <input
            type="text"
            formControlName="fullName"
            placeholder="ابحث بالاسم..."
            class="h-11 w-full rounded-lg border border-outline-variant bg-surface-container-lowest pr-10 pl-3.5 text-sm text-on-surface placeholder:text-on-surface-variant outline-none transition-all duration-200 focus:border-secondary focus:ring-4 focus:ring-secondary/20"
          />

          <svg
            class="pointer-events-none absolute right-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-on-surface-variant"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"
            />
          </svg>
        </div>
      </div>

      <!-- Gender -->
      <div>
        <label class="mb-1.5 block text-sm font-medium text-on-surface-variant">النوع</label>

        <div class="relative">
          <select
            formControlName="gender"
            class="h-11 w-full appearance-none rounded-lg border border-outline-variant bg-surface-container-lowest px-3.5 pl-10 text-sm text-on-surface outline-none transition-all duration-200 focus:border-secondary focus:ring-4 focus:ring-secondary/20"
          >
            <option [ngValue]="null">الكل</option>

            @for (gender of genders; track gender) {
              <option [ngValue]="gender">
                {{ getGenderLabel(gender) }}
              </option>
            }
          </select>

          <svg
            class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-on-surface-variant"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </div>
      </div>

      <!-- Age Category -->
      <div>
        <label class="mb-1.5 block text-sm font-medium text-on-surface-variant">فئة العمر</label>

        <div class="relative">
          <select
            formControlName="ageCategory"
            class="h-11 w-full appearance-none rounded-lg border border-outline-variant bg-surface-container-lowest px-3.5 pl-10 text-sm text-on-surface outline-none transition-all duration-200 focus:border-secondary focus:ring-4 focus:ring-secondary/20"
          >
            <option [ngValue]="null">الكل</option>

            @for (ageCategory of ageCategories; track ageCategory) {
              <option [ngValue]="ageCategory">
                {{ getAgeCategoryLabel(ageCategory) }}
              </option>
            }
          </select>

          <svg
            class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-on-surface-variant"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </div>
      </div>

      <!-- Age Sort -->
      <div>
        <label class="mb-1.5 block text-sm font-medium text-on-surface-variant">ترتيب العمر</label>

        <div class="relative">
          <select
            formControlName="ageSort"
            class="h-11 w-full appearance-none rounded-lg border border-outline-variant bg-surface-container-lowest px-3.5 pl-10 text-sm text-on-surface outline-none transition-all duration-200 focus:border-secondary focus:ring-4 focus:ring-secondary/20"
          >
            <option [ngValue]="null">بدون ترتيب</option>

            @for (sort of ageSorts; track sort) {
              <option [ngValue]="sort">
                {{ getAgeSortLabel(sort) }}
              </option>
            }
          </select>

          <svg
            class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-on-surface-variant"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </div>
      </div>
    </div>

    <!-- Advanced Filters Toggle -->
    <div class="flex items-center gap-3 pt-1 m-0">
      <div class="h-px flex-1 bg-outline-variant/20"></div>

      <button
        type="button"
        (click)="toggleAdvanced()"
        class="group inline-flex shrink-0 cursor-pointer items-center gap-1.5 text-sm font-medium text-on-surface-variant transition-all duration-200 hover:text-secondary focus:outline-none"
      >
        <!-- Tune/Sliders Icon -->
        <svg
          class="h-4 w-4 shrink-0 transition-colors duration-200 group-hover:text-secondary"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M10.5 6h9.75M10.5 6a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-9.75 0h9.75"
          />
        </svg>

        <span class="relative">
          فلاتر إضافية
          <span
            class="absolute -bottom-0.5 left-0 h-0.5 w-0 bg-secondary transition-all duration-300 group-hover:w-full"
            [class.w-full]="showAdvanced"
          ></span>
        </span>

        <!-- Active Filters Badge -->
        @if (activeAdvancedCount > 0) {
          <span
            class="inline-flex h-5 min-w-[1.25rem] items-center justify-center rounded-full bg-secondary/10 px-1.5 text-xs font-semibold text-secondary transition-all duration-200"
          >
            {{ activeAdvancedCount }}
          </span>
        }

        <!-- Chevron -->
        <svg
          class="h-3.5 w-3.5 shrink-0 transition-transform duration-300"
          [class.rotate-180]="showAdvanced"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 9l-7 7-7-7"
          />
        </svg>
      </button>

      <div class="h-px flex-1 bg-outline-variant/20"></div>
    </div>

    <!-- Advanced Filters Content -->
    <div
      class="grid transition-[grid-template-rows] duration-300 ease-in-out m-0"
      [style.grid-template-rows]="showAdvanced ? '1fr' : '0fr'"
    >
      <div class="overflow-hidden">
        <div
          class="grid grid-cols-1 gap-5 pt-4 transition-all duration-300 ease-out md:grid-cols-2 xl:grid-cols-4"
          [class.opacity-100]="showAdvanced"
          [class.translate-y-0]="showAdvanced"
          [class.opacity-0]="!showAdvanced"
          [class.-translate-y-2]="!showAdvanced"
        >
          <!-- Government -->
          <div>
            <label class="mb-1.5 block text-sm font-medium text-on-surface-variant">المحافظة</label>

            <input
              formControlName="government"
              placeholder="المحافظة..."
              class="h-11 w-full rounded-lg border border-outline-variant bg-surface-container-lowest px-3.5 text-sm text-on-surface placeholder:text-on-surface-variant outline-none transition-all duration-200 focus:border-secondary focus:ring-4 focus:ring-secondary/20"
            />
          </div>

          <!-- City -->
          <div>
            <label class="mb-1.5 block text-sm font-medium text-on-surface-variant">المدينة</label>

            <input
              formControlName="city"
              placeholder="المدينة..."
              class="h-11 w-full rounded-lg border border-outline-variant bg-surface-container-lowest px-3.5 text-sm text-on-surface placeholder:text-on-surface-variant outline-none transition-all duration-200 focus:border-secondary focus:ring-4 focus:ring-secondary/20"
            />
          </div>

          <!-- From Date -->
          <div>
            <label class="mb-1.5 block text-sm font-medium text-on-surface-variant">من تاريخ</label>

            <input
              type="date"
              formControlName="fromDate"
              class="h-11 w-full rounded-lg border border-outline-variant bg-surface-container-lowest px-3.5 text-sm text-on-surface outline-none transition-all duration-200 focus:border-secondary focus:ring-4 focus:ring-secondary/20"
            />
          </div>

          <!-- To Date -->
          <div>
            <label class="mb-1.5 block text-sm font-medium text-on-surface-variant"
              >إلى تاريخ</label
            >

            <input
              type="date"
              formControlName="toDate"
              class="h-11 w-full rounded-lg border border-outline-variant bg-surface-container-lowest px-3.5 text-sm text-on-surface outline-none transition-all duration-200 focus:border-secondary focus:ring-4 focus:ring-secondary/20"
            />
          </div>

          <!-- Date Sort -->
          <div>
            <label class="mb-1.5 block text-sm font-medium text-on-surface-variant"
              >ترتيب التاريخ</label
            >

            <div class="relative">
              <select
                formControlName="dateSort"
                class="h-11 w-full appearance-none rounded-lg border border-outline-variant bg-surface-container-lowest px-3.5 pl-10 text-sm text-on-surface outline-none transition-all duration-200 focus:border-secondary focus:ring-4 focus:ring-secondary/20"
              >
                <option [ngValue]="null">بدون ترتيب</option>
                <option [ngValue]="0">{{ getDateSortLabel(0) }}</option>
                <option [ngValue]="1">{{ getDateSortLabel(1) }}</option>
              </select>

              <svg
                class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-on-surface-variant"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 9l-7 7-7-7"
                />
              </svg>
            </div>
          </div>

          <!-- Extended Filters -->
          <ng-content select="[extendedFilters]"></ng-content>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="flex flex-wrap justify-end gap-3 pt-2">
      <button
        type="button"
        (click)="resetFilters()"
        class="rounded-lg border border-outline-variant bg-surface-container px-5 py-2.5 text-sm font-semibold text-on-surface transition-all duration-200 hover:bg-surface-container-highest hover:border-outline-variant/80"
      >
        إعادة تعيين
      </button>
    </div>
  </form>
</div>
