<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
  <div
    class="w-full max-w-md overflow-hidden rounded-3xl border border-outline-variant/20 bg-surface-container-lowest shadow-2xl"
  >
    <!-- Header -->
    <div class="flex items-start gap-4 border-b border-outline-variant/20 px-6 py-5">
      <div
        class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-error-container text-error"
      >
        <span class="material-symbols-rounded text-3xl">
          warning
        </span>
      </div>

      <div class="flex-1">
        <h2 class="text-lg font-semibold text-on-surface">
          {{ title() }}
        </h2>

        <p class="mt-1 text-sm leading-6 text-on-surface-variant">
          {{ message() }}
        </p>
      </div>

      <button
        type="button"
        class="rounded-xl p-2 text-on-surface-variant transition-colors hover:bg-surface-container hover:text-on-surface"
        (click)="cancel.emit()"
      >
        <span class="material-symbols-rounded">close</span>
      </button>
    </div>

    <!-- Footer -->
    <div class="flex justify-end gap-3 px-6 py-5">
      <app-button variant="secondary" (onClick)="cancel.emit()">
        {{ cancelText() }}
      </app-button>

      <app-button variant="danger" (onClick)="confirm.emit()">
        <span class="material-symbols-rounded mr-2 text-lg">
          delete
        </span>
        {{ confirmText() }}
      </app-button>
    </div>
  </div>
</div>
