<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 animate-fade-in" (click)="cancel.emit()">
  <div class="w-full max-w-120 rounded-3xl border border-outline-variant/20 bg-surface shadow-2xl animate-scale-in flex flex-col overflow-hidden" (click)="$event.stopPropagation()">
    
    <div class="px-6 pt-10 pb-8 flex flex-col items-center text-center">
      <div class="w-20 h-20 rounded-full flex items-center justify-center mb-6" 
           [ngClass]="variant() === 'danger' ? 'bg-error/10 text-error' : 'bg-primary/10 text-primary'">
        <span class="material-symbols-outlined text-[40px]">{{ icon() }}</span>
      </div>
      
      <h2 class="text-2xl font-bold text-on-surface mb-3">
        {{ title() }}
      </h2>
      
      <p class="text-base leading-relaxed text-on-surface-variant px-4">
        {{ message() }}
      </p>
      
      <ng-content></ng-content>
    </div>

    <div class="flex justify-between items-center gap-4 bg-surface-container-lowest px-6 py-6 border-t border-outline-variant/10">
      <app-button [variant]="variant()" [disabled]="confirmDisabled()" [loading]="confirmLoading()" extraClass="min-w-[140px] px-6 h-13 rounded-xl flex items-center justify-center font-bold text-base shadow-md" (onClick)="confirm.emit()">
        {{ confirmText() }}
      </app-button>

      <app-button variant="secondary" extraClass="min-w-[140px] px-6 h-13 rounded-xl flex items-center justify-center font-bold text-base" (onClick)="cancel.emit()">
        {{ cancelText() }}
      </app-button>
    </div>
    
  </div>
</div>
