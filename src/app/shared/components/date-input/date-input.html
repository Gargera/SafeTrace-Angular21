@if (label) {
  <label class="mb-1.5 block text-sm font-medium text-on-surface-variant">{{ label }}</label>
}
<div class="relative">
  <input
    type="date"
    [value]="value"
    [disabled]="disabled"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
    class="block w-full rounded-xl border-0 bg-surface-container-low py-2.5 px-3 text-on-surface shadow-sm ring-1 ring-inset ring-outline-variant focus:ring-2 focus:ring-inset focus:ring-secondary sm:text-sm sm:leading-6 transition-all duration-200"
  />
</div>
