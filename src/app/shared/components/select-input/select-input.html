@if (label) {
  <label class="mb-1.5 block text-sm font-medium text-on-surface-variant">{{ label }}</label>
}
<div class="relative">
  <select
    [ngModel]="value"
    (ngModelChange)="onModelChange($event)"
    (blur)="handleBlur()"
    [disabled]="disabled"
    class="block w-full cursor-pointer appearance-none rounded-xl border-0 bg-surface-container-low py-2.5 pl-10 pr-4 text-on-surface shadow-sm ring-1 ring-inset ring-outline-variant focus:ring-2 focus:ring-inset focus:ring-secondary sm:text-sm sm:leading-6 transition-all duration-200"
  >
    <ng-content></ng-content>
  </select>
  @if (icon) {
    <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
      <ng-content select="[icon]"></ng-content>
    </div>
  }
</div>
