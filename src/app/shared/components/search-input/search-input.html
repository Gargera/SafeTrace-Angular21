<div class="relative">
  <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3">
    <app-icon name="search" size="1rem" extraClass="text-on-surface-variant"></app-icon>
  </div>
  <input
    type="text"
    [value]="value"
    [disabled]="disabled"
    [placeholder]="placeholder"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
    class="block w-full rounded-xl border-0 bg-surface-container-low py-2.5 pr-10 pl-3 text-on-surface shadow-sm ring-1 ring-inset ring-outline-variant placeholder:text-on-surface-variant/50 focus:ring-2 focus:ring-inset focus:ring-secondary sm:text-sm sm:leading-6 transition-all duration-200"
  />
</div>
