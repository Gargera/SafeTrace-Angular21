<div
  [class]="containerClass()"
  [class.fixed.inset-0.z-50.flex.items-center.justify-center.bg-black/40.backdrop-blur-sm]="
    fullscreen()
  "
  [class.flex.flex-col.items-center.justify-center]="!fullscreen()"
>
  <div class="flex flex-col items-center gap-4">
    <!-- Spinner Container -->
    <div class="relative inline-flex items-center justify-center">
      <!-- Rotating Ring -->
      <div
        class="animate-spin"
        style="border-radius: 50%; border-style: solid; background-color: transparent;"
        [class.border-4]="size() === 'sm' || size() === 'md'"
        [class.border-8]="size() === 'lg'"
        [class.border-surface-container-highest]="variant() === 'secondary'"
        [class.border-outline-variant/30]="variant() === 'primary'"
        [class.border-t-secondary]="variant() === 'secondary'"
        [class.border-t-primary]="variant() === 'primary'"
        [style.width]="size() === 'sm' ? '64px' : (size() === 'md' ? '96px' : '128px')"
        [style.height]="size() === 'sm' ? '64px' : (size() === 'md' ? '96px' : '128px')"
      ></div>
      <!-- Logo -->
      <img 
        src="/images/logo.svg" 
        alt="Loading..." 
        class="absolute drop-shadow-sm object-contain"
        style="border-radius: 50%; background-color: transparent;"
        [style.width]="size() === 'sm' ? '52px' : (size() === 'md' ? '84px' : '108px')"
        [style.height]="size() === 'sm' ? '52px' : (size() === 'md' ? '84px' : '108px')"
      />
    </div>

    @if (showTitle() && title()) {
      <h3 class="text-center text-lg font-semibold text-on-surface">
        {{ title() }}
      </h3>
    }

    @if (showSubtitle() && subtitle()) {
      <p class="max-w-3xl text-center text-sm leading-6 text-on-surface-variant">
        {{ subtitle() }}
      </p>
    }
  </div>
</div>
