<div
  [class]="containerClass()"
  [class.fixed.inset-0.z-50.flex.items-center.justify-center.bg-surface/80]="fullscreen()"
  [class.flex.flex-col.items-center.justify-center]="!fullscreen()"
>
  <div class="flex flex-col items-center gap-3">
    <!-- Spinner -->
    <div
      class="animate-spin rounded-full border-4 border-secondary/30 border-t-secondary"
      [class.h-8.w-8]="size() === 'sm'"
      [class.h-12.w-12]="size() === 'md'"
      [class.h-16.w-16]="size() === 'lg'"
    ></div>

    @if (title()) {
      <h3 class="text-lg font-semibold text-on-surface">{{ title() }}</h3>
    }

    @if (subtitle()) {
      <p class="text-sm text-on-surface-variant">{{ subtitle() }}</p>
    }
  </div>
</div>
