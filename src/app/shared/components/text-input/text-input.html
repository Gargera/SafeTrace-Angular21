@if (label) {
  <label class="mb-1.5 block text-sm font-medium text-on-surface-variant">{{ label }}</label>
}
<div class="relative">
  @if (prefix) {
    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3">
      <ng-content select="[prefix]"></ng-content>
    </div>
  }
  <input
    [type]="type"
    [value]="value"
    [disabled]="disabled"
    [placeholder]="placeholder"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
    class="block w-full rounded-xl border-0 bg-surface-container-low py-2.5 text-on-surface shadow-sm ring-1 ring-inset ring-outline-variant placeholder:text-on-surface-variant/50 focus:ring-2 focus:ring-inset focus:ring-secondary sm:text-sm sm:leading-6 transition-all duration-200"
    [ngClass]="{ 'pr-10': prefix, 'pl-10': suffix }"
  />
  @if (suffix) {
    <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
      <ng-content select="[suffix]"></ng-content>
    </div>
  }
</div>
