@if (label()) {
  <label class="mb-1.5 block text-sm font-medium text-on-surface-variant">
    {{ label() }}
  </label>
}

<div class="relative">
  @if (prefix()) {
    <div class="absolute inset-y-0 right-0 flex items-center pr-3 text-on-surface-variant">
      <ng-content select="[prefix]"></ng-content>
    </div>
  }

  @switch (type()) {
    @case ('textarea') {
      <textarea
        [value]="value"
        [rows]="rows()"
        [disabled]="disabled"
        [placeholder]="placeholder()"
        (input)="handleInput($event)"
        (blur)="handleBlur()"
        class="w-full rounded-lg border border-outline-variant bg-surface-container-lowest py-3 text-sm text-on-surface placeholder:text-on-surface-variant/60 outline-none transition-all duration-200 focus:border-secondary focus:ring-4 focus:ring-secondary/20 disabled:cursor-not-allowed disabled:opacity-60"
        [class.pr-10]="prefix()"
        [class.pl-10]="suffix()"
        [class.pr-3.5]="!prefix()"
        [class.pl-3.5]="!suffix()"
      ></textarea>
    }

    @case ('select') {
      <select
        [ngModel]="value"
        (ngModelChange)="onModelChange($event)"
        (blur)="handleBlur()"
        [disabled]="disabled"
        class="h-11 w-full appearance-none rounded-lg border border-outline-variant bg-surface-container-lowest text-sm text-on-surface outline-none transition-all duration-200 focus:border-secondary focus:ring-4 focus:ring-secondary/20 disabled:cursor-not-allowed disabled:opacity-60"
        [class.pr-10]="prefix()"
        [class.pl-10]="suffix() || true"
        [class.pr-3.5]="!prefix()"
      >
        <ng-content></ng-content>
      </select>
      <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-on-surface-variant">
        <span class="material-symbols-outlined">expand_more</span>
      </div>
    }

    @default {
      <input
        [type]="type()"
        [value]="value"
        [disabled]="disabled"
        [placeholder]="placeholder()"
        (input)="handleInput($event)"
        (blur)="handleBlur()"
        class="h-11 w-full rounded-lg border border-outline-variant bg-surface-container-lowest text-sm text-on-surface placeholder:text-on-surface-variant/60 outline-none transition-all duration-200 focus:border-secondary focus:ring-4 focus:ring-secondary/20 disabled:cursor-not-allowed disabled:opacity-60"
        [class.pr-10]="prefix()"
        [class.pl-10]="suffix()"
        [class.pr-3.5]="!prefix()"
        [class.pl-3.5]="!suffix()"
      />
    }
  }

  @if (suffix()) {
    <div class="absolute inset-y-0 left-0 flex items-center pl-3 text-on-surface-variant">
      <ng-content select="[suffix]"></ng-content>
    </div>
  }
</div>
